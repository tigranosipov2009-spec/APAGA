<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none">
  <!-- Building mark -->
  <g transform="translate(2,4)">
    <!-- gold accent building behind -->
    <path d="M22 6 L22 44 L34 44 L34 14 Z" fill="#E89F2E"/>
    <!-- main navy building -->
    <path d="M10 4 L10 44 L22 44 L22 18 L16 4 Z" fill="#14182B"/>
    <!-- house roof base -->
    <path d="M2 44 L22 24 L42 44 Z" fill="#14182B"/>
    <!-- door/window square -->
    <rect x="19" y="36" width="6" height="6" fill="#E89F2E"/>
  </g>

  <!-- Wordmark -->
  <text x="56" y="32" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="22" fill="#14182B" letter-spacing="2">АПАГА</text>
  <!-- accent underline -->
  <rect x="56" y="36" width="22" height="2" fill="#E89F2E" rx="1"/>
  <!-- subtitle -->
  <text x="56" y="48" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="7.5" fill="#7C8198" letter-spacing="1.6">СТРОИТЕЛЬНАЯ КОМПАНИЯ</text>
</svg>
